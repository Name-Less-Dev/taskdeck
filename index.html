<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Theme before the first paint: synchronous, before the CSS and the bundle, so the
      page never flashes the wrong colours. Mirrors parseTheme/resolveTheme in
      src/ui/theme.ts (tests/ui/theme-boot.test.ts runs this exact script against them).
      Stored in localStorage only (never IndexedDB or backups); unavailable = auto.
    -->
    <script>
      ;(function () {
        var themes = ['auto', 'dark', 'light', 'lilac', 'pastel', 'neon']
        var theme = 'auto'
        try {
          var raw = JSON.parse(window.localStorage.getItem('taskdeck:ui:theme'))
          if (themes.indexOf(raw) !== -1) theme = raw
        } catch (error) {}
        var dark = false
        try {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (error) {}
        var root = document.documentElement
        root.setAttribute('data-theme', theme === 'auto' ? (dark ? 'dark' : 'light') : theme)
        root.setAttribute('data-theme-choice', theme)
      })()
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Same values as --color-bg in src/index.css (checked by tests/pwa/manifest.test.ts). -->
    <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>taskdeck</title>
    <meta name="description" content="Suas tarefas como um baralho: uma carta por vez, deslize para concluir, adiar ou apagar. Funciona offline e exporta prazos para o calendário." />
    <!-- Open Graph / Twitter. TODO: public/og.png (1200x630) does not exist yet; it must be
         made by hand (see README, "Pending"). Until then link previews show no image. -->
    <meta property="og:title" content="taskdeck" />
    <meta property="og:description" content="Suas tarefas como um baralho: uma carta por vez, deslize para concluir, adiar ou apagar. Funciona offline e exporta prazos para o calendário." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://taskdeck-flax.vercel.app/" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="https://taskdeck-flax.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="taskdeck" />
    <meta name="twitter:description" content="Suas tarefas como um baralho: uma carta por vez, deslize para concluir, adiar ou apagar. Funciona offline e exporta prazos para o calendário." />
    <meta name="twitter:image" content="https://taskdeck-flax.vercel.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
