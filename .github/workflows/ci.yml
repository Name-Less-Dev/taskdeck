name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Report bundle size (gzip)
        run: |
          {
            echo '| File | Raw (bytes) | Gzip (bytes) |'
            echo '| --- | ---: | ---: |'
            for file in dist/assets/*.js dist/assets/*.css; do
              echo "| ${file#dist/} | $(wc -c < "$file") | $(gzip -9 -c "$file" | wc -c) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [America/Sao_Paulo, UTC, Pacific/Auckland]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Show effective time zone
        run: node -e "console.log(Intl.DateTimeFormat().resolvedOptions().timeZone)"
      - run: npm run test:coverage

  e2e:
    name: End-to-end (Playwright, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per engine, in parallel; each installs only its own browser.
          - browser: chromium
            projects: --project=desktop --project=mobile
          - browser: firefox
            projects: --project=firefox
          - browser: webkit
            projects: --project=webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Install ${{ matrix.browser }} and its system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # playwright.config.ts builds the app and serves it with vite preview.
      - run: npm run e2e -- ${{ matrix.projects }}
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  docker:
    name: Docker image (nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t taskdeck .
      - run: docker run -d --name taskdeck -p 8080:80 taskdeck
      - name: Wait for nginx
        run: |
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 1
          done
          exit 1
      # Status, SPA fallback, cache headers and gzip (see the script).
      - run: sh scripts/docker-smoke.sh http://localhost:8080
      - name: Container logs
        if: always()
        run: docker logs taskdeck
