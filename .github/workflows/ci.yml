name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Report bundle size (gzip)
        run: |
          {
            echo '| File | Raw (bytes) | Gzip (bytes) |'
            echo '| --- | ---: | ---: |'
            for file in dist/assets/*.js dist/assets/*.css; do
              echo "| ${file#dist/} | $(wc -c < "$file") | $(gzip -9 -c "$file" | wc -c) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [America/Sao_Paulo, UTC, Pacific/Auckland]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Show effective time zone
        run: node -e "console.log(Intl.DateTimeFormat().resolvedOptions().timeZone)"
      - run: npm run test:coverage
