# taskdeck static server (see Dockerfile). Rules that matter for the PWA:
# - index.html, sw.js and the manifest are never cached, so a new deploy is
#   seen at once and the service worker's own update check works;
# - files with a content hash in their name are cached for a year;
# - any unknown path falls back to index.html (single-page app).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # Built by Vite with a content hash (index-<hash>.js, index-<hash>.css, ...).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Workbox runtime imported by sw.js, also named with a hash (workbox-<hash>.js).
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cached: they decide which version of the app runs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: an unknown path is served index.html (through the
    # location above, so it is not cached either).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
